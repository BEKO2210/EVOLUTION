<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Evolution Clicker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* === HEADER === */
        .header {
            background: rgba(10, 10, 15, 0.95);
            border-bottom: 1px solid rgba(0, 255, 150, 0.2);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: #00ff96;
            text-shadow: 0 0 10px rgba(0, 255, 150, 0.5);
        }

        .stats {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: #00ff96;
            font-weight: 700;
            font-size: 1rem;
        }

        /* === MAIN AREA === */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 16px;
        }

        /* Partikel-Hintergrund */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 150, 0.3);
            border-radius: 50%;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* Zelle */
        .cell-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .dna-ring {
            position: absolute;
            border: 2px solid rgba(0, 255, 150, 0.2);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        .dna-ring:nth-child(1) { width: 160px; height: 160px; }
        .dna-ring:nth-child(2) { width: 190px; height: 190px; animation-duration: 15s; animation-direction: reverse; border-style: dashed; }
        .dna-ring:nth-child(3) { width: 220px; height: 220px; animation-duration: 25s; border-color: rgba(0, 255, 150, 0.1); }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cell-core {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00ff96, #006644);
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.2);
            animation: pulse 2s infinite ease-in-out;
            transition: transform 0.1s;
            position: relative;
        }

        .cell-core::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 25%;
            width: 30%;
            height: 20%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: rotate(-45deg);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Floating Text */
        .float-text {
            position: absolute;
            color: #00ff96;
            font-weight: 800;
            font-size: 1.1rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(0, 255, 150, 0.8);
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
        }

        .click-info {
            text-align: center;
            margin-top: 20px;
            z-index: 1;
        }

        .click-info p {
            color: #666;
            font-size: 0.8rem;
        }

        .click-power {
            color: #00ff96;
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* === TABS === */
        .tabs {
            display: flex;
            background: rgba(10, 10, 15, 0.95);
            border-top: 1px solid rgba(0, 255, 150, 0.2);
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 14px 8px;
            text-align: center;
            background: none;
            border: none;
            color: #666;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab.active {
            color: #00ff96;
            background: rgba(0, 255, 150, 0.05);
            box-shadow: inset 0 2px 0 #00ff96;
        }

        .tab:active {
            background: rgba(0, 255, 150, 0.1);
        }

        /* === UPGRADES PANEL === */
        .upgrades-panel {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            -webkit-overflow-scrolling: touch;
        }

        .upgrade-section-title {
            color: #00ff96;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 12px 4px 8px;
            opacity: 0.8;
        }

        .upgrade {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .upgrade:active {
            transform: scale(0.98);
            background: rgba(0, 255, 150, 0.08);
        }

        .upgrade.can-afford {
            border-color: rgba(0, 255, 150, 0.3);
        }

        .upgrade.can-afford:active {
            background: rgba(0, 255, 150, 0.12);
            border-color: rgba(0, 255, 150, 0.5);
        }

        .upgrade.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .upgrade.locked:active {
            transform: none;
            background: rgba(255, 255, 255, 0.03);
        }

        .upgrade-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
            width: 40px;
            text-align: center;
        }

        .upgrade-info {
            flex: 1;
            min-width: 0;
        }

        .upgrade-name {
            font-weight: 700;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .upgrade-desc {
            font-size: 0.7rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upgrade-cost {
            font-size: 0.8rem;
            color: #00ff96;
            font-weight: 700;
            flex-shrink: 0;
        }

        .upgrade-count {
            position: absolute;
            right: 12px;
            bottom: 4px;
            font-size: 0.7rem;
            color: rgba(0, 255, 150, 0.4);
            font-weight: 700;
        }

        /* === BOOSTS PANEL === */
        .boosts-panel {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .boost-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
        }

        .boost-card h3 {
            color: #fff;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .boost-card p {
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .boost-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .boost-btn:active {
            transform: scale(0.95);
        }

        .boost-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .auto-clicker-status {
            background: rgba(0, 255, 150, 0.05);
            border: 1px solid rgba(0, 255, 150, 0.2);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auto-clicker-status .status-text {
            color: #00ff96;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .auto-clicker-status .status-sub {
            color: #888;
            font-size: 0.75rem;
        }

        /* === OFFLINE EARNINGS POPUP === */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .popup {
            background: #1a1a2e;
            border: 2px solid #00ff96;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            animation: popupIn 0.3s ease;
        }

        @keyframes popupIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup h2 {
            color: #00ff96;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .popup p {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .popup .big-number {
            color: #00ff96;
            font-size: 1.5rem;
            font-weight: 800;
            margin: 12px 0;
        }

        .popup-btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #00ff96, #008f58);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        .popup-btn:active {
            transform: scale(0.95);
        }

        /* === HIDDEN === */
        .hidden {
            display: none !important;
        }

        /* Mobile-Optimierungen */
        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }
        
        /* Verhindert Doppel-Tap-Zoom auf allen Elementen */
        button, .upgrade, .cell-container {
            touch-action: manipulation;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 150, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">🔬 Evolution</div>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">DNA</div>
                <div class="stat-value" id="dna">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">/s</div>
                <div class="stat-value" id="dps">0</div>
            </div>
        </div>
    </div>

    <!-- Main Area (Cell) -->
    <div class="main" id="mainArea">
        <div class="particles" id="particles"></div>
        <div class="cell-container" id="cellContainer">
            <div class="dna-ring"></div>
            <div class="dna-ring"></div>
            <div class="dna-ring"></div>
            <div class="cell-core" id="cellCore"></div>
        </div>
        <div class="click-info">
            <p>Klicke auf die Zelle</p>
            <div class="click-power">+<span id="clickValue">1</span> DNA</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('auto')">🔄 Auto</button>
        <button class="tab" onclick="switchTab('click')">👆 Klick</button>
        <button class="tab" onclick="switchTab('boosts')">⚡ Boosts</button>
    </div>

    <!-- Auto Upgrades Panel -->
    <div class="upgrades-panel" id="autoPanel">
        <div class="upgrade-section-title">Automatische Produktion</div>
        <div id="autoUpgrades"></div>
    </div>

    <!-- Click Upgrades Panel -->
    <div class="upgrades-panel hidden" id="clickPanel">
        <div class="upgrade-section-title">Klick-Power</div>
        <div id="clickUpgrades"></div>
    </div>

    <!-- Boosts Panel -->
    <div class="boosts-panel hidden" id="boostsPanel">
        <div class="auto-clicker-status">
            <div>
                <div class="status-text">🤖 Auto-Clicker</div>
                <div class="status-sub" id="autoClickerSub">Nicht aktiviert</div>
            </div>
            <div class="upgrade-cost" id="autoClickerCost">10K DNA</div>
        </div>
        <div class="boost-card">
            <h3>🔄 Prestige</h3>
            <p>Reset für permanenten x<span id="prestigeMult">2</span> Multiplier</p>
            <button class="boost-btn" id="prestigeBtn" onclick="doPrestige()" disabled>
                Benötigt: <span id="prestigeCost">1M</span> DNA
            </button>
        </div>
        <div class="boost-card">
            <h3>📊 Statistiken</h3>
            <p>Gesamte DNA: <span id="totalDna">0</span></p>
            <p>Prestiges: <span id="prestigeCount">0</span></p>
            <p>Spielzeit: <span id="playTime">0m</span></p>
        </div>
    </div>

    <!-- Offline Earnings Popup -->
    <div class="popup-overlay hidden" id="offlinePopup">
        <div class="popup">
            <h2>💤 Offline-Earnings</h2>
            <p>Du warst <span id="offlineTime">0</span> Minuten weg</p>
            <div class="big-number">+<span id="offlineEarnings">0</span> DNA</div>
            <button class="popup-btn" onclick="closeOfflinePopup()">Cool!</button>
        </div>
    </div>

    <script>
        // ===================== GAME STATE =====================
        let game = {
            dna: 0,
            totalDna: 0,
            clickPower: 1,
            dps: 0,
            prestigePoints: 0,
            prestigeMultiplier: 1,
            autoClickerLevel: 0,
            autoClickerInterval: null,
            startTime: Date.now(),
            lastSave: Date.now(),
            lastOnline: Date.now()
        };

        // ===================== UPGRADES DATA =====================
        // Auto Upgrades (12)
        const autoUpgrades = [
            { id: 'a1', name: 'Mitochondrien', icon: '⚡', desc: '+0.5 DNA/s', baseCost: 15, baseDps: 0.5, count: 0, unlockAt: 0 },
            { id: 'a2', name: 'Ribosomen', icon: '🔬', desc: '+2 DNA/s', baseCost: 100, baseDps: 2, count: 0, unlockAt: 1 },
            { id: 'a3', name: 'Zellkern', icon: '🧬', desc: '+8 DNA/s', baseCost: 500, baseDps: 8, count: 0, unlockAt: 2 },
            { id: 'a4', name: 'Geißeln', icon: '🌊', desc: '+30 DNA/s', baseCost: 2500, baseDps: 30, count: 0, unlockAt: 3 },
            { id: 'a5', name: 'Chloroplasten', icon: '🌿', desc: '+100 DNA/s', baseCost: 12000, baseDps: 100, count: 0, unlockAt: 4 },
            { id: 'a6', name: 'Vakuolen', icon: '💧', desc: '+350 DNA/s', baseCost: 50000, baseDps: 350, count: 0, unlockAt: 5 },
            { id: 'a7', name: 'Zellwand', icon: '🛡️', desc: '+1.2K DNA/s', baseCost: 200000, baseDps: 1200, count: 0, unlockAt: 6 },
            { id: 'a8', name: 'Gewebe', icon: '🧩', desc: '+5K DNA/s', baseCost: 800000, baseDps: 5000, count: 0, unlockAt: 7 },
            { id: 'a9', name: 'Organe', icon: '❤️', desc: '+20K DNA/s', baseCost: 3.5e6, baseDps: 20000, count: 0, unlockAt: 8 },
            { id: 'a10', name: 'Muskulatur', icon: '💪', desc: '+80K DNA/s', baseCost: 15e6, baseDps: 80000, count: 0, unlockAt: 9 },
            { id: 'a11', name: 'Nervensystem', icon: '🧠', desc: '+300K DNA/s', baseCost: 60e6, baseDps: 300000, count: 0, unlockAt: 10 },
            { id: 'a12', name: 'Organismus', icon: '🦠', desc: '+1.2M DNA/s', baseCost: 250e6, baseDps: 1200000, count: 0, unlockAt: 11 }
        ];

        // Click Upgrades (12)
        const clickUpgrades = [
            { id: 'c1', name: 'Enzyme', icon: '⚗️', desc: '+1 Klick', baseCost: 50, power: 1, count: 0, unlockAt: 0 },
            { id: 'c2', name: 'Katalysatoren', icon: '🔥', desc: '+5 Klick', baseCost: 300, power: 5, count: 0, unlockAt: 1 },
            { id: 'c3', name: 'Hormone', icon: '💊', desc: '+20 Klick', baseCost: 1500, power: 20, count: 0, unlockAt: 2 },
            { id: 'c4', name: 'Neurotransmitter', icon: '⚡', desc: '+80 Klick', baseCost: 8000, power: 80, count: 0, unlockAt: 3 },
            { id: 'c5', name: 'Synapsen', icon: '🔗', desc: '+300 Klick', baseCost: 40000, power: 300, count: 0, unlockAt: 4 },
            { id: 'c6', name: 'Axone', icon: '📡', desc: '+1.2K Klick', baseCost: 180000, power: 1200, count: 0, unlockAt: 5 },
            { id: 'c7', name: 'Rezeptoren', icon: '🔮', desc: '+5K Klick', baseCost: 800000, power: 5000, count: 0, unlockAt: 6 },
            { id: 'c8', name: 'Ionenkanäle', icon: '⚡', desc: '+20K Klick', baseCost: 3.5e6, power: 20000, count: 0, unlockAt: 7 },
            { id: 'c9', name: 'Dendriten', icon: '🌳', desc: '+80K Klick', baseCost: 15e6, power: 80000, count: 0, unlockAt: 8 },
            { id: 'c10', name: 'Neuron', icon: '🧠', desc: '+300K Klick', baseCost: 60e6, power: 300000, count: 0, unlockAt: 9 },
            { id: 'c11', name: 'Ganglien', icon: '🕸️', desc: '+1.2M Klick', baseCost: 250e6, power: 1200000, count: 0, unlockAt: 10 },
            { id: 'c12', name: 'Zerebrum', icon: '👑', desc: '+5M Klick', baseCost: 1e9, power: 5000000, count: 0, unlockAt: 11 }
        ];

        // Auto Clicker Config
        const autoClickerLevels = [
            { cost: 10000, clicksPerSecond: 1 },
            { cost: 50000, clicksPerSecond: 2 },
            { cost: 200000, clicksPerSecond: 5 },
            { cost: 1e6, clicksPerSecond: 10 },
            { cost: 5e6, clicksPerSecond: 20 },
            { cost: 25e6, clicksPerSecond: 50 }
        ];

        // ===================== UTILS =====================
        function formatNumber(num) {
            if (num >= 1e15) return (num / 1e15).toFixed(2) + 'Q';
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
            return Math.floor(num).toString();
        }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            if (minutes < 60) return minutes + 'm';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h';
            return Math.floor(hours / 24) + 'd';
        }

        function getCost(upgrade) {
            return Math.floor(upgrade.baseCost * Math.pow(1.15, upgrade.count));
        }

        // ===================== RENDER =====================
        function render() {
            document.getElementById('dna').textContent = formatNumber(game.dna);
            document.getElementById('dps').textContent = formatNumber(game.dps);
            document.getElementById('clickValue').textContent = formatNumber(game.clickPower * game.prestigeMultiplier);
            document.getElementById('totalDna').textContent = formatNumber(game.totalDna);
            document.getElementById('prestigeCount').textContent = game.prestigePoints;
            document.getElementById('playTime').textContent = formatTime(Date.now() - game.startTime);

            renderAutoUpgrades();
            renderClickUpgrades();
            renderBoosts();
        }

        function renderAutoUpgrades() {
            const container = document.getElementById('autoUpgrades');
            container.innerHTML = autoUpgrades.map((u, index) => {
                const cost = getCost(u);
                const canAfford = game.dna >= cost;
                const isUnlocked = index === 0 || autoUpgrades[index - 1].count > 0;
                
                if (!isUnlocked) {
                    return `
                        <div class="upgrade locked">
                            <div class="upgrade-icon">🔒</div>
                            <div class="upgrade-info">
                                <div class="upgrade-name">???</div>
                                <div class="upgrade-desc">Freischalten durch: ${autoUpgrades[index - 1].name}</div>
                            </div>
                            <div class="upgrade-cost">---</div>
                        </div>
                    `;
                }

                return `
                    <div class="upgrade ${canAfford ? 'can-afford' : ''}" onclick="buyAuto('${u.id}')">
                        <div class="upgrade-icon">${u.icon}</div>
                        <div class="upgrade-info">
                            <div class="upgrade-name">${u.name}</div>
                            <div class="upgrade-desc">${u.desc} · Besitz: ${u.count}</div>
                        </div>
                        <div class="upgrade-cost">${formatNumber(cost)}</div>
                        <div class="upgrade-count">${u.count}</div>
                    </div>
                `;
            }).join('');
        }

        function renderClickUpgrades() {
            const container = document.getElementById('clickUpgrades');
            container.innerHTML = clickUpgrades.map((u, index) => {
                const cost = getCost(u);
                const canAfford = game.dna >= cost;
                const isUnlocked = index === 0 || clickUpgrades[index - 1].count > 0;
                
                if (!isUnlocked) {
                    return `
                        <div class="upgrade locked">
                            <div class="upgrade-icon">🔒</div>
                            <div class="upgrade-info">
                                <div class="upgrade-name">???</div>
                                <div class="upgrade-desc">Freischalten durch: ${clickUpgrades[index - 1].name}</div>
                            </div>
                            <div class="upgrade-cost">---</div>
                        </div>
                    `;
                }

                return `
                    <div class="upgrade ${canAfford ? 'can-afford' : ''}" onclick="buyClick('${u.id}')">
                        <div class="upgrade-icon">${u.icon}</div>
                        <div class="upgrade-info">
                            <div class="upgrade-name">${u.name}</div>
                            <div class="upgrade-desc">${u.desc} · Besitz: ${u.count}</div>
                        </div>
                        <div class="upgrade-cost">${formatNumber(cost)}</div>
                        <div class="upgrade-count">${u.count}</div>
                    </div>
                `;
            }).join('');
        }

        function renderBoosts() {
            const prestigeCost = 1e6 * Math.pow(10, game.prestigePoints);
            const prestigeBtn = document.getElementById('prestigeBtn');
            
            if (game.dna >= prestigeCost) {
                prestigeBtn.disabled = false;
                prestigeBtn.textContent = `Prestige jetzt! (${formatNumber(prestigeCost)})`;
            } else {
                prestigeBtn.disabled = true;
                prestigeBtn.innerHTML = `Benötigt: <span id="prestigeCost">${formatNumber(prestigeCost)}</span> DNA`;
            }
            
            document.getElementById('prestigeMult').textContent = Math.pow(2, game.prestigePoints + 1);

            // Auto Clicker
            const acLevel = autoClickerLevels[game.autoClickerLevel];
            if (acLevel) {
                document.getElementById('autoClickerSub').textContent = `${acLevel.clicksPerSecond} Klicks/s`;
                document.getElementById('autoClickerCost').textContent = formatNumber(acLevel.cost) + ' DNA';
            } else {
                document.getElementById('autoClickerSub').textContent = 'Max Level erreicht!';
                document.getElementById('autoClickerCost').textContent = '---';
            }
        }

        // ===================== ACTIONS =====================
        function clickCell(e) {
            const gain = game.clickPower * game.prestigeMultiplier;
            addDna(gain);

            // Floating Text - von Zelle-Mitte wenn kein Event
            const floatText = document.createElement('div');
            floatText.className = 'float-text';
            floatText.textContent = '+' + formatNumber(gain);
            
            let x, y;
            if (e && (e.clientX || (e.touches && e.touches[0]))) {
                x = e.clientX || e.touches[0].clientX;
                y = e.clientY || e.touches[0].clientY;
            } else {
                const rect = document.getElementById('cellContainer').getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top + rect.height / 2;
            }
            
            floatText.style.left = (x - 30) + 'px';
            floatText.style.top = (y - 40) + 'px';
            document.body.appendChild(floatText);
            setTimeout(() => floatText.remove(), 800);
            
            // Zelle-Pulse Animation
            const core = document.getElementById('cellCore');
            core.style.transform = 'scale(0.85)';
            setTimeout(() => core.style.transform = '', 150);
        }

        function addDna(amount) {
            game.dna += amount;
            game.totalDna += amount;
            render();
        }

        function buyAuto(id) {
            const upgrade = autoUpgrades.find(u => u.id === id);
            const cost = getCost(upgrade);
            if (game.dna >= cost) {
                game.dna -= cost;
                upgrade.count++;
                recalcDps();
                render();
                saveGame();
            }
        }

        function buyClick(id) {
            const upgrade = clickUpgrades.find(u => u.id === id);
            const cost = getCost(upgrade);
            if (game.dna >= cost) {
                game.dna -= cost;
                upgrade.count++;
                recalcClickPower();
                render();
                saveGame();
            }
        }

        function recalcDps() {
            game.dps = autoUpgrades.reduce((sum, u) => sum + u.baseDps * u.count * game.prestigeMultiplier, 0);
        }

        function recalcClickPower() {
            game.clickPower = 1 + clickUpgrades.reduce((sum, u) => sum + u.power * u.count, 0);
        }

        function buyAutoClicker() {
            const acLevel = autoClickerLevels[game.autoClickerLevel];
            if (acLevel && game.dna >= acLevel.cost) {
                game.dna -= acLevel.cost;
                game.autoClickerLevel++;
                setupAutoClicker();
                render();
                saveGame();
            }
        }

        function setupAutoClicker() {
            if (game.autoClickerInterval) {
                clearInterval(game.autoClickerInterval);
            }
            
            const acLevel = autoClickerLevels[game.autoClickerLevel - 1];
            if (acLevel) {
                const interval = 1000 / acLevel.clicksPerSecond;
                game.autoClickerInterval = setInterval(() => {
                    clickCell();
                }, interval);
            }
        }

        function doPrestige() {
            const prestigeCost = 1e6 * Math.pow(10, game.prestigePoints);
            if (game.dna >= prestigeCost) {
                game.prestigePoints++;
                game.prestigeMultiplier = Math.pow(2, game.prestigePoints);
                
                // Reset
                game.dna = 0;
                game.clickPower = 1;
                game.dps = 0;
                game.autoClickerLevel = 0;
                
                if (game.autoClickerInterval) {
                    clearInterval(game.autoClickerInterval);
                    game.autoClickerInterval = null;
                }
                
                autoUpgrades.forEach(u => u.count = 0);
                clickUpgrades.forEach(u => u.count = 0);
                
                alert(`Prestige! x${game.prestigeMultiplier} Multiplier aktiviert!`);
                render();
                saveGame();
            }
        }

        // ===================== TABS =====================
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('autoPanel').classList.toggle('hidden', tab !== 'auto');
            document.getElementById('clickPanel').classList.toggle('hidden', tab !== 'click');
            document.getElementById('boostsPanel').classList.toggle('hidden', tab !== 'boosts');
        }

        // ===================== GAME LOOP =====================
        setInterval(() => {
            if (game.dps > 0) {
                addDna(game.dps);
            }
        }, 1000);

        // ===================== SAVE / LOAD =====================
        function saveGame() {
            const data = {
                game: game,
                autoUpgrades: autoUpgrades.map(u => ({ id: u.id, count: u.count })),
                clickUpgrades: clickUpgrades.map(u => ({ id: u.id, count: u.count })),
                timestamp: Date.now()
            };
            localStorage.setItem('evolutionClickerV2', JSON.stringify(data));
        }

        function loadGame() {
            const saved = localStorage.getItem('evolutionClickerV2');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    
                    // Restore game state
                    Object.assign(game, data.game);
                    
                    // Restore upgrades
                    data.autoUpgrades.forEach(s => {
                        const u = autoUpgrades.find(x => x.id === s.id);
                        if (u) u.count = s.count;
                    });
                    data.clickUpgrades.forEach(s => {
                        const u = clickUpgrades.find(x => x.id === s.id);
                        if (u) u.count = s.count;
                    });
                    
                    recalcDps();
                    recalcClickPower();
                    
                    // Setup auto clicker
                    if (game.autoClickerLevel > 0) {
                        setupAutoClicker();
                    }
                    
                    // Offline earnings
                    if (data.timestamp) {
                        const offlineMs = Date.now() - data.timestamp;
                        const offlineSeconds = offlineMs / 1000;
                        const maxOfflineSeconds = 7200; // Max 2 hours
                        const effectiveSeconds = Math.min(offlineSeconds, maxOfflineSeconds);
                        const offlineEarnings = game.dps * effectiveSeconds;
                        
                        if (offlineEarnings > 0) {
                            game.dna += offlineEarnings;
                            game.totalDna += offlineEarnings;
                            
                            document.getElementById('offlineTime').textContent = Math.floor(effectiveSeconds / 60);
                            document.getElementById('offlineEarnings').textContent = formatNumber(offlineEarnings);
                            document.getElementById('offlinePopup').classList.remove('hidden');
                        }
                    }
                } catch(e) {
                    console.error('Load error', e);
                }
            }
            render();
        }

        function closeOfflinePopup() {
            document.getElementById('offlinePopup').classList.add('hidden');
        }

        // Auto-save alle 30 Sekunden
        setInterval(saveGame, 30000);

        // ===================== INIT =====================
        document.getElementById('cellContainer').addEventListener('click', clickCell);
        document.getElementById('cellContainer').addEventListener('touchstart', (e) => {
            e.preventDefault();
            clickCell(e);
        });

        // Partikel generieren
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 8 + 's';
            particle.style.animationDuration = (6 + Math.random() * 4) + 's';
            particlesContainer.appendChild(particle);
        }

        // Auto-Clicker Button
        document.querySelector('.auto-clicker-status').addEventListener('click', buyAutoClicker);

        // Spiel laden
        loadGame();
    </script>
</body>
</html>
